name: Release artifacts
on:
  workflow_run:
    workflows: ['Verify']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools==84.0.0
      - name: Require this exact verified main revision
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$RELEASE_SHA"
      - name: Build reproducible artifacts
        run: |
          python scripts/build_release.py
          cp dist/SHA256SUMS first-SHA256SUMS
          python scripts/build_release.py
          cmp dist/SHA256SUMS first-SHA256SUMS
          python scripts/release_gate.py --report release-gate.json
      - name: Tag and publish after approved main publication and green CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" > tag.json 2>/dev/null; then
            test "$(python -c "import json;print(json.load(open('tag.json'))['object']['sha'])")" = "$RELEASE_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/v0.1.0 -f sha="$RELEASE_SHA"
          fi
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release already exists; retained assets are immutable.'
          else
            gh release create v0.1.0 dist/* --verify-tag --title 'PhiBench v0.1.0 — receipt laboratory' --notes-file docs/RELEASE-NOTES.md
          fi
