name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build pinned Bubblewrap in the checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev meson ninja-build util-linux python3
          mkdir -p .ci-bin .ci-build
          curl --fail --location --proto '=https' --tlsv1.2 --output .ci-build/bubblewrap.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          printf '%s  %s\n' '9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314' '.ci-build/bubblewrap.tar.xz' | sha256sum --check
          tar -xJf .ci-build/bubblewrap.tar.xz -C .ci-build
          meson setup .ci-build/build .ci-build/bubblewrap-0.12.0 -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C .ci-build/build
          cp .ci-build/build/bwrap .ci-bin/bwrap
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"
      - run: bwrap --version
      - run: python -m pip install . setuptools==84.0.0
      - name: Probe isolated execution
        run: |
          python - <<'PY'
          import tempfile
          from phibench.sandbox import Sandbox
          with tempfile.TemporaryDirectory() as workspace:
              print(Sandbox().execute(workspace, 'print("PHIBENCH_ISOLATED")'))
          PY
          phibench doctor
      - run: python -m unittest discover -s tests -v
      - run: python tests/acceptance.py
      - name: Build, repeat and inspect distribution
        run: |
          python scripts/build_release.py
          cp dist/SHA256SUMS .ci-build/first-SHA256SUMS
          python scripts/build_release.py
          cmp dist/SHA256SUMS .ci-build/first-SHA256SUMS
          python scripts/release_gate.py --report .ci-build/release-gate.json
      - name: Install wheel offline outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/phi-install"
          "$RUNNER_TEMP/phi-install/bin/python" -m pip install --no-index dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/phi-install/bin/phibench" doctor
          "$RUNNER_TEMP/phi-install/bin/phibench" demo --out fresh-phi
          "$RUNNER_TEMP/phi-install/bin/phibench" verify fresh-phi
          "$RUNNER_TEMP/phi-install/bin/phibench" observe fresh-phi --out installed-laboratory.html
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
