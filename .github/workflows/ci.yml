name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build pinned Bubblewrap in the checkout
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libcap-dev meson ninja-build util-linux python3
          mkdir -p .ci-bin .ci-build
          curl --fail --location --proto '=https' --tlsv1.2 --output .ci-build/bubblewrap.tar.xz https://github.com/containers/bubblewrap/releases/download/v0.12.0/bubblewrap-0.12.0.tar.xz
          printf '%s  %s\n' '9760d007363e3abba7c747489910f9f82d9fca53ba3bd3282e396fa3c97a3314' '.ci-build/bubblewrap.tar.xz' | sha256sum --check
          tar -xJf .ci-build/bubblewrap.tar.xz -C .ci-build
          meson setup .ci-build/build .ci-build/bubblewrap-0.12.0 -Dman=disabled -Dtests=false -Dselinux=disabled -Dbash_completion=disabled -Dzsh_completion=disabled
          meson compile -C .ci-build/build
          cp .ci-build/build/bwrap .ci-bin/bwrap
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"
      - run: bwrap --version
      - run: python -m pip install .
      - name: Probe isolated execution
        run: |
          python - <<'PY'
          import tempfile
          from phibench.sandbox import Sandbox
          with tempfile.TemporaryDirectory() as workspace:
              print(Sandbox().execute(workspace, 'print("PHIBENCH_ISOLATED")'))
          PY
          phibench doctor
      - run: python -m unittest discover -s tests -v
      - run: python tests/acceptance.py
